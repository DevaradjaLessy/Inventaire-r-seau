# NetCarto — exemple de fichier de réglages.
# Copiez-le (par exemple en netcarto.toml), adaptez-le, puis lancez :
#   node netcarto.js --config netcarto.toml
# Ne mettez aucun mot de passe ici : une valeur "env:NOM" est lue dans la variable d'environnement NOM.

[serveur]
hote = "127.0.0.1"      # 127.0.0.1 = ce poste seulement. Mettez l'adresse du serveur pour l'ouvrir à vos collègues.
port = 8443

[https]
actif = true            # HTTPS par défaut. Sans fichiers ci-dessous, un certificat auto-signé est créé dans le dossier de données.
# noms = ["netcarto.exemple.interne", "192.0.2.10"]   # noms et adresses à inscrire dans le certificat auto-signé
# certificat = "certificats/netcarto.crt"
# cle = "certificats/netcarto.key"

[securite]
echecsMax = 5           # échecs de connexion avant verrouillage du compte
verrouillageMinutes = 15
sessionHeures = 12      # durée maximale d'une session
inactiviteMinutes = 120 # une session inactive est fermée

[donnees]
dossier = "donnees"     # dossier de la base ; un chemin relatif part du dossier de ce fichier

[sauvegardes]
actif = true            # une sauvegarde automatique par jour
heure = "02:30"         # heure locale du serveur
conserver = 14          # nombre de sauvegardes automatiques gardées
# dossier = "/chemin/vers/un/autre/disque"   # par défaut : « sauvegardes » dans le dossier de données

[web]
dossier = ".."          # dossier qui contient index.html, css/ et js/

[limites]
corpsMaxMo = 25         # taille maximale d'une requête (import d'une base, plan en image)

[supervision]
intervalle = 30         # secondes entre deux relevés

# Sources de supervision (facultatif). Voir connecteurs/README.md pour le détail.
# [[supervision.sources]]
# type = "prtg"
# url = "https://prtg.exemple.interne"
# apiToken = "env:PRTG_TOKEN"

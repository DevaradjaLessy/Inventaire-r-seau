<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NetCarto — Cartographie et inventaire réseau</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23111821'/%3E%3Cpath d='M5 17V7l7 10V7m4 0h3m-3 5h3m-3 5h3' stroke='%2338bdf8' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<!-- Three.js 0.160.0 par CDN (seule bibliothèque externe) -->
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<style>
/* ============================================================
   STYLES — thème sombre de type DCIM
   ============================================================ */
:root{
  --bg:#090d12; --panel:#111821; --panel2:#16202b; --panel3:#1b2733; --line:#1f2b39; --line2:#2c3c50;
  --txt:#d7e0ea; --txt2:#8b9bb0; --txt3:#5d6c80; --accent:#38bdf8; --accent-bg:rgba(56,189,248,.12);
  --up:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b; --down:#6b7a8c; --dis:#3b4656;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:6px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--txt);font:13px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-weight:600}
a{color:var(--accent)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#243244;border-radius:5px;border:2px solid var(--panel)}
::-webkit-scrollbar-track{background:transparent}
.mono{font-family:var(--mono);font-size:12px}
.muted{color:var(--txt2)} .dim{color:var(--txt3)}
.ico{width:16px;height:16px;flex:none;vertical-align:-3px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.grow{flex:1} .row{display:flex;align-items:center;gap:8px} .wrap{flex-wrap:wrap}
.hidden{display:none!important}

/* --- En-tête --- */
#topbar{height:50px;flex:none;display:flex;align-items:center;gap:14px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px;letter-spacing:.2px}
.brand svg{width:26px;height:26px}
.brand b{color:var(--accent);font-weight:700}
.demo-tag{font-size:11px;font-weight:600;color:var(--warn);border:1px solid rgba(250,178,25,.4);background:rgba(250,178,25,.08);padding:2px 8px;border-radius:20px;white-space:nowrap}
#tabs{display:flex;gap:2px;height:100%}
#tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:0 13px;color:var(--txt2);cursor:pointer;display:flex;align-items:center;gap:7px;font-weight:500;height:100%}
#tabs button:hover{color:var(--txt);background:rgba(255,255,255,.03)}
#tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--crit);color:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.gsearch{position:relative;flex:1;max-width:420px;margin-left:auto}
.gsearch .ico{position:absolute;left:9px;top:8px;color:var(--txt3)}
#gsearch{width:100%;padding-left:30px}
.gsearch kbd{position:absolute;right:8px;top:6px;font:11px var(--mono);color:var(--txt3);border:1px solid var(--line2);border-radius:4px;padding:0 5px}
#gsearch-res{position:absolute;top:36px;left:0;right:0;background:var(--panel2);border:1px solid var(--line2);border-radius:var(--r);box-shadow:0 12px 32px rgba(0,0,0,.5);max-height:70vh;overflow:auto;z-index:60}
#gsearch-res .grp{padding:6px 10px 2px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--txt3)}
#gsearch-res .it{padding:6px 10px;cursor:pointer;display:flex;gap:8px;align-items:center}
#gsearch-res .it:hover,#gsearch-res .it.cur{background:var(--accent-bg)}
#gsearch-res .it small{color:var(--txt2);margin-left:auto;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%}
.tools{display:flex;gap:6px}

/* --- Composants --- */
.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:var(--r);border:1px solid var(--line2);background:var(--panel2);color:var(--txt);cursor:pointer;white-space:nowrap;font-weight:500}
.btn:hover{background:var(--panel3);border-color:#3a4d66}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.pri{background:#0b6ea3;border-color:#1287c4;color:#fff}
.btn.pri:hover{background:#0d7fbb}
.btn.danger{border-color:rgba(208,59,59,.55);color:#f08c8c}
.btn.danger:hover{background:rgba(208,59,59,.15)}
.btn.sm{height:24px;padding:0 7px;font-size:12px}
.btn.icon{width:30px;padding:0;justify-content:center}
.btn.sm.icon{width:24px}
.btn.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:var(--r);overflow:hidden}
.seg button{background:var(--panel2);border:0;border-right:1px solid var(--line2);height:28px;padding:0 10px;color:var(--txt2);cursor:pointer;display:flex;align-items:center;gap:6px;font-weight:500}
.seg button:last-child{border-right:0}
.seg button:hover{color:var(--txt)}
.seg button.on{background:var(--accent-bg);color:var(--accent)}
input[type=text],input[type=search],input[type=number],input[type=date],select,textarea{background:#0c1219;border:1px solid var(--line2);border-radius:var(--r);height:30px;padding:0 9px;outline:none;min-width:0}
textarea{height:auto;padding:7px 9px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(56,189,248,.15)}
select{padding-right:4px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--txt2)}
label.f>span{white-space:nowrap}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.form-grid .full{grid-column:1/-1}
.chip{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:20px;font-size:11.5px;font-weight:600;border:1px solid var(--line2);background:var(--panel2);white-space:nowrap}
.chip .dot{width:8px;height:8px;border-radius:50%;flex:none}
.st{display:inline-flex;align-items:center;gap:5px;font-weight:600;font-size:12px;white-space:nowrap}
.st i{width:9px;height:9px;border-radius:50%;flex:none}
.st.dis i{background:transparent!important;border:2px dotted #6b7a8c}
.vl{display:inline-flex;align-items:center;gap:5px;font-size:12px;white-space:nowrap}
.vl i{width:10px;height:10px;border-radius:2px;flex:none}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px}
.panel>h3,.sec-t{font-size:11.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--txt2);font-weight:600}
table.t{width:100%;border-collapse:collapse}
table.t th{position:sticky;top:0;background:var(--panel2);text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--txt2);padding:8px 10px;border-bottom:1px solid var(--line2);white-space:nowrap;z-index:1}
table.t td{padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t tbody tr:hover{background:rgba(56,189,248,.05)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12.5px}
.kv dt{color:var(--txt2)} .kv dd{margin:0;text-align:right;overflow-wrap:anywhere}
.empty{padding:28px;text-align:center;color:var(--txt3)}
.bar{height:8px;border-radius:4px;background:#0c1219;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;border-radius:3px;background:var(--accent)}

/* --- Zone principale et onglets --- */
main{flex:1;min-height:0;position:relative}
.tab{position:absolute;inset:0;display:none}
.tab.on{display:flex}

/* --- Modales, infobulles, notifications --- */
#modal-root{position:fixed;inset:0;background:rgba(3,6,10,.72);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
#modal-root.on{display:flex}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:10px;width:560px;max-width:100%;max-height:100%;display:flex;flex-direction:column;box-shadow:0 24px 64px rgba(0,0,0,.6)}
.modal.wide{width:820px}
.modal header{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
.modal header h2{font-size:15px;flex:1}
.modal .body{padding:16px;overflow:auto}
.modal footer{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
#tip{position:fixed;z-index:200;pointer-events:none;background:#05080c;border:1px solid var(--line2);border-radius:6px;padding:6px 9px;font-size:12px;max-width:320px;box-shadow:0 8px 24px rgba(0,0,0,.6);display:none;line-height:1.5}
#tip b{display:block;color:#fff}
#tip .l{color:var(--txt2)}
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:300}
.toast{background:var(--panel3);border:1px solid var(--line2);border-left:3px solid var(--accent);border-radius:6px;padding:9px 12px;min-width:240px;max-width:420px;box-shadow:0 8px 24px rgba(0,0,0,.5);display:flex;gap:10px;align-items:center}
.toast.ok{border-left-color:var(--up)} .toast.err{border-left-color:var(--crit)} .toast.warn{border-left-color:var(--warn)}
.toast button{margin-left:auto}

/* --- Cartographie --- */
.carto{display:grid;grid-template-columns:270px minmax(0,1fr) 360px;width:100%;height:100%}
.c-tree,.c-detail{background:var(--panel);display:flex;flex-direction:column;min-height:0}
.c-tree{border-right:1px solid var(--line)} .c-detail{border-left:1px solid var(--line);overflow:auto}
.c-tree-h{padding:8px;border-bottom:1px solid var(--line)} .c-tree-h input{width:100%}
#tree{overflow:auto;flex:1;padding:4px 0}
.tn{display:flex;align-items:center;height:26px;white-space:nowrap;cursor:pointer;padding-right:8px}
.tn:hover{background:rgba(255,255,255,.04)}
.tn.sel{background:var(--accent-bg);color:var(--accent);box-shadow:inset 2px 0 var(--accent)}
.tn .car{width:18px;height:26px;display:flex;align-items:center;justify-content:center;color:var(--txt3);flex:none}
.tn .car .ico{width:12px;height:12px}
.tn .lb{display:flex;align-items:center;gap:6px;flex:1;min-width:0;height:100%}
.tn .lb span{overflow:hidden;text-overflow:ellipsis}
.tn .lb .ico{width:14px;height:14px;color:var(--txt2)}
.tn.sel .lb .ico{color:var(--accent)}
.tn small{color:var(--txt3);font-size:11px;margin-left:auto;padding-left:6px}
.tn .dotst{width:7px;height:7px;border-radius:50%;flex:none}
.c-main{display:flex;flex-direction:column;min-width:0;min-height:0}
.c-bar{display:flex;align-items:center;gap:10px;padding:7px 10px;border-bottom:1px solid var(--line);background:var(--panel)}
#crumb{display:flex;align-items:center;gap:2px;flex:1;min-width:0;overflow:hidden;white-space:nowrap}
#crumb a{color:var(--txt2);cursor:pointer;padding:3px 6px;border-radius:4px;display:flex;align-items:center;gap:5px;text-decoration:none}
#crumb a:hover{background:rgba(255,255,255,.05);color:var(--txt)}
#crumb a:last-child{color:var(--txt);font-weight:600}
#crumb .sep{color:var(--txt3)}
#crumb .ico{width:13px;height:13px}
#c-view{flex:1;position:relative;min-height:0}
.cv{position:absolute;inset:0;display:none}
.cv.on{display:block}
.overlay{position:absolute;display:flex;gap:6px;align-items:center;z-index:5}
.overlay .btn.on{background:#0d2a3a}
.overlay.tl{top:10px;left:10px} .overlay.tr{top:10px;right:10px} .overlay.bl{bottom:10px;left:10px} .overlay.br{bottom:10px;right:10px}
.legend{background:rgba(9,13,18,.88);border:1px solid var(--line);border-radius:6px;padding:7px 10px;display:flex;gap:6px 12px;flex-wrap:wrap;font-size:11.5px;color:var(--txt2);max-width:520px}
.legend span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.legend i{width:10px;height:10px;border-radius:2px;flex:none;display:inline-block}
.legend b{color:var(--txt);font-weight:600}
/* Plan 2D */
svg.plan{width:100%;height:100%;display:block;background:#070a0e;cursor:grab;user-select:none}
svg.plan.panning{cursor:grabbing}
svg.plan .room{stroke:#3a4d66;stroke-width:3;cursor:pointer}
svg.plan .room:hover{stroke:#5b7696}
svg.plan .room.sel{stroke:var(--accent);stroke-width:4}
svg.plan .rname{fill:#7f90a6;font-weight:600;text-anchor:middle;pointer-events:none}
svg.plan .rtype{fill:#4d5c70;text-anchor:middle;pointer-events:none}
svg.plan .pobj{cursor:pointer}
svg.plan .pobj .hit{fill:transparent}
svg.plan .pobj.sel .ring{stroke:var(--accent);stroke-width:2.2;fill:rgba(56,189,248,.18)}
svg.plan .ring{fill:none;stroke:none}
svg.plan .lbl{fill:#9aa9bb;font-size:5px;pointer-events:none;display:none}
svg.plan.zoomed .lbl{display:block}
svg.plan .rlabel{fill:#c9d4e0;font-size:6px;font-weight:600;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:#070a0e;stroke-width:2px}
svg.plan.editing .pobj{cursor:move}
svg.plan .trace-line{fill:none;stroke:var(--accent);stroke-width:2.4;stroke-dasharray:8 6;animation:dash 1s linear infinite;pointer-events:none;stroke-linejoin:round}
svg.plan .trace-halo{fill:rgba(56,189,248,.18);stroke:var(--accent);stroke-width:1.6;pointer-events:none}
@keyframes dash{to{stroke-dashoffset:-28}}
.floor-cards{position:absolute;inset:0;overflow:auto;padding:18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;align-content:start}
.fcard{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;cursor:pointer}
.fcard:hover{border-color:var(--accent)}
.fcard h4{font-size:13px;margin-bottom:2px}
.fcard svg{width:100%;height:170px;margin-top:8px;background:#070a0e;border-radius:6px}
/* Fiche de détails */
.d-head{padding:14px;border-bottom:1px solid var(--line);display:flex;gap:11px;align-items:flex-start}
.d-head .dico{width:38px;height:38px;border-radius:8px;background:var(--panel3);display:flex;align-items:center;justify-content:center;flex:none;color:var(--accent)}
.d-head .dico .ico{width:20px;height:20px}
.d-head h2{font-size:15px;overflow-wrap:anywhere}
.d-head .sub{color:var(--txt2);font-size:12px}
.d-sec{padding:12px 14px;border-bottom:1px solid var(--line)}
.d-sec>.sec-t{margin-bottom:8px;display:flex;align-items:center;gap:6px}
.d-sec .btns{display:flex;gap:6px;flex-wrap:wrap}
.li{display:flex;align-items:center;gap:8px;padding:5px 7px;border-radius:5px;cursor:pointer;min-width:0}
.li:hover{background:rgba(255,255,255,.05)}
.li .ico{color:var(--txt2);width:14px;height:14px}
.li>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li small{margin-left:auto;color:var(--txt2);white-space:nowrap;padding-left:8px}
.fld{display:grid;grid-template-columns:112px 1fr;gap:6px 8px;align-items:center;font-size:12.5px}
.fld>label{color:var(--txt2)}
.fld input,.fld select{height:26px;width:100%;font-size:12.5px}
.fld .ro{min-height:26px;display:flex;align-items:center;overflow-wrap:anywhere}
.pgrid{display:flex;flex-direction:column;gap:8px}
.pgrp{display:grid;gap:2px;grid-auto-flow:column;justify-content:start}
.pc{width:11px;height:11px;border-radius:2px;cursor:pointer;border:1px solid rgba(0,0,0,.4)}
.pc:hover{outline:2px solid #fff;outline-offset:0}
.pc.sel{outline:2px solid var(--accent);outline-offset:1px}
.pc.hollow{background:transparent!important;border:1px solid #44556a}
.pc.dis{background:transparent!important;border:1px dotted #6b7a8c}
.pc.hl{box-shadow:0 0 0 2px var(--accent)}
.hop{display:flex;gap:9px;align-items:flex-start;padding:5px 6px;border-radius:5px;cursor:pointer;position:relative}
.hop:hover{background:rgba(255,255,255,.05)}
.hop .n{width:20px;height:20px;border-radius:50%;background:var(--accent-bg);border:1px solid var(--accent);color:var(--accent);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.hop .cabl{color:var(--txt3);font-size:11px}
.hop b{font-weight:600}

/* --- Vue 3D et élévation de baie --- */
.rackview{display:grid;grid-template-columns:236px minmax(0,1fr);width:100%;height:100%}
.elev{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:10px}
.elev h4{font-size:13px;display:flex;align-items:center;gap:6px;margin-bottom:2px}
.elev .sub{color:var(--txt2);font-size:11.5px;margin-bottom:8px}
.elev-grid{display:grid;grid-template-columns:22px 1fr;gap:1px;background:#05080c;border:1px solid var(--line2);border-radius:4px;padding:2px}
.eu-n{font:10px var(--mono);color:var(--txt3);display:flex;align-items:center;justify-content:center;background:#0c1219}
.eu{background:#0c1219;min-height:0;font-size:11px;display:flex;align-items:center;padding:0 6px;gap:5px;overflow:hidden;white-space:nowrap}
.eu.free{color:transparent;cursor:pointer}
.eu.free:hover,.eu.free.over{background:var(--accent-bg);color:var(--accent);outline:1px dashed var(--accent);outline-offset:-1px}
.eu.free.bad{background:rgba(208,59,59,.2);outline:1px dashed var(--crit)}
.eu.dev{background:var(--panel3);border-left:3px solid var(--cc,#8b9bb0);cursor:pointer;color:var(--txt)}
.eu.dev:hover{background:#243446}
.eu.dev.sel{background:var(--accent-bg);box-shadow:inset 0 0 0 1px var(--accent)}
.eu.dev .ico{width:12px;height:12px;color:var(--txt2)}
.eu.dev span{overflow:hidden;text-overflow:ellipsis}
.r3d{position:relative;min-width:0;min-height:0;background:#0a0f15}
.v3d{position:absolute;inset:0}
.v3d canvas{outline:none}
.palette{position:absolute;right:10px;top:10px;bottom:10px;width:230px;background:rgba(17,24,33,.96);border:1px solid var(--line2);border-radius:8px;display:flex;flex-direction:column;z-index:6}
.palette h4{padding:9px 11px;border-bottom:1px solid var(--line);font-size:12.5px;display:flex;align-items:center;gap:6px}
.palette .list{overflow:auto;padding:6px;display:flex;flex-direction:column;gap:5px}
.pal-it{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);cursor:grab;font-size:12px}
.pal-it:hover{border-color:var(--accent)}
.pal-it .ico{color:var(--txt2)}
.pal-it b{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:140px}
.pal-it small{color:var(--txt2)}
.pal-it .q{margin-left:auto;font-weight:700;color:var(--accent)}

/* --- Topologie --- */
svg.topo{width:100%;height:100%;display:block;background:#070a0e;cursor:grab;user-select:none}
svg.topo .tnode{cursor:pointer}
svg.topo .tb{fill:#141d28;stroke:#2c3c50;stroke-width:1.2}
svg.topo .tnode:hover .tb{stroke:#5b7696}
svg.topo .tnode.hl .tb{stroke:var(--accent);stroke-width:2;fill:#0f2a3a}
svg.topo .tnode.sel .tb{stroke:#fff;stroke-width:2}
svg.topo .tlink.hl{stroke:var(--accent)!important;stroke-width:4;stroke-dasharray:9 6;animation:dash 1s linear infinite}
/*@@CSS*/
</style>
</head>
<body>
<header id="topbar">
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="1" width="22" height="22" rx="5" fill="#0c1219" stroke="#1f2b39" stroke-width="1"/><path d="M5 17V7l7 10V7m4 0h3m-3 5h3m-3 5h3"/></svg>
    <span>Net<b>Carto</b></span>
    <span class="demo-tag" data-tip="Données fictives|Cette page est publique : toutes les données affichées sont inventées.">Données fictives</span>
  </div>
  <nav id="tabs"></nav>
  <div class="gsearch">
    <svg class="ico" viewBox="0 0 24 24"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM21 21l-4.3-4.3"/></svg>

function emptyDb() {
  return {
    meta: { app: APP.name, schemaVersion: APP.schemaVersion, updatedAt: Date.now(), demo: false, seq: 0 },
    vlans: [], sites: [], buildings: [], floors: [], rooms: [], racks: [], devices: [], ports: [], outlets: [], cables: [],
    catalog: [], stock: [], history: [],
  };
}
/* Crée les ports d'un équipement à partir des groupes de ports de son modèle */
function mkPorts(db, dev, cat) {
  const out = []; let idx = 0;
  for (const grp of cat.ports || []) {
    const n = grp.names ? grp.names.length : grp.count;
    for (let i = 0; i < n; i++) {
      const passive = grp.role === 'pp';
      out.push({
        id: nextId(db, 'p'), deviceId: dev.id, idx: idx++,
        name: grp.names ? grp.names[i] : `${grp.prefix || ''}${(grp.start ?? 1) + i}`,
        kind: grp.kind, role: grp.role || 'access', speed: grp.speed || 1000,
        status: passive ? 'up' : 'down', vlan: passive || grp.role === 'uplink' ? null : 1,
        poe: { capable: !!grp.poe, watts: 0 }, mac: '', connected: '', description: '',
      });
    }
  }
  return out;
}
/* Crée un équipement et ses ports dans la base (sans toucher au stock) */
function mkDevice(db, cat, p) {
  const dev = {
    id: nextId(db, 'dev'), catalogId: cat.id, hostname: p.hostname || cat.model, rackId: p.rackId || null, u: p.u || null,
    roomId: p.roomId || null, x: p.x ?? null, y: p.y ?? null, serial: p.serial || '', ip: p.ip || '', mac: p.mac || '',
    firmware: p.firmware ?? cat.firmware ?? '', installDate: p.installDate || today(), status: p.status || 'active', notes: p.notes || '',
  };
  db.devices.push(dev);
  const ports = mkPorts(db, dev, cat);
  db.ports.push(...ports);
  return { dev, ports };
}

  const rkCore = addRack('A0', 'INFO', 'cat-rack42', 'BAIE-A0-01', 3, 4.5);
  const rkSrv = addRack('A0', 'INFO', 'cat-rack42', 'BAIE-A0-02', 4.2, 4.5);

  const rkB1 = addRack('B1', 'LT', 'cat-rack15', 'COFFRET-B1-01', 2, 0.5);

  // Baie de cœur (bâtiment A, RDC)
  const foA0 = put(rkCore, 42, 'cat-fo24', 'FO-A0-01');
  put(rkCore, 41, 'cat-mgr1u', 'PC-A0-01');
  const core = put(rkCore, 40, 'cat-c9500-16x', 'SW-A0-CORE-01');
  const fw = put(rkCore, 38, 'cat-fg100f', 'FW-A0-01');
  const rtr = put(rkCore, 37, 'cat-isr4331', 'RTR-A0-01');
  const ppA0a = put(rkCore, 35, 'cat-pp24', 'PP-A0-01');
  put(rkCore, 34, 'cat-mgr1u', 'PC-A0-02');
  const swA0 = put(rkCore, 33, 'cat-c9200l-48p-4x', 'SW-A0-ACC-01');
  put(rkCore, 32, 'cat-mgr1u', 'PC-A0-03');
  const ppA0b = put(rkCore, 31, 'cat-pp24', 'PP-A0-02');
  const upsA0 = put(rkCore, 1, 'cat-srt3000', 'OND-A0-01');
  // Baie serveurs
  put(rkSrv, 41, 'cat-mgr1u', 'PC-A0-04');
  const swSrv = put(rkSrv, 40, 'cat-c9200l-24t-4x', 'SW-A0-SRV-01');
  const srv1 = put(rkSrv, 30, 'cat-dl380', 'SRV-A0-01', { notes: 'Hyperviseur 1' });
  const srv2 = put(rkSrv, 28, 'cat-dl380', 'SRV-A0-02', { notes: 'Hyperviseur 2' });
  const srv3 = put(rkSrv, 26, 'cat-r650', 'SRV-A0-03', { notes: 'Sauvegarde' });
  const srv4 = put(rkSrv, 25, 'cat-r650', 'SRV-A0-04', { notes: 'Supervision', status: 'maintenance' });
  const upsA0b = put(rkSrv, 1, 'cat-srt3000', 'OND-A0-02');
  // Local technique A1
  const foA1 = put(rkA1, 42, 'cat-fo24', 'FO-A1-01');
  const ppA1a = put(rkA1, 40, 'cat-pp24', 'PP-A1-01');
  put(rkA1, 39, 'cat-mgr1u', 'PC-A1-01');
  const swA1a = put(rkA1, 38, 'cat-c9200l-48p-4x', 'SW-A1-ACC-01');
  put(rkA1, 37, 'cat-mgr1u', 'PC-A1-02');
  const ppA1b = put(rkA1, 36, 'cat-pp24', 'PP-A1-02');
  const ppA1c = put(rkA1, 34, 'cat-pp24', 'PP-A1-03');
  put(rkA1, 33, 'cat-mgr1u', 'PC-A1-03');
  const swA1b = put(rkA1, 32, 'cat-c9200l-24p-4g', 'SW-A1-ACC-02');
  const upsA1 = put(rkA1, 1, 'cat-5px1500', 'OND-A1-01');
  // Local technique A2
  const foA2 = put(rkA2, 42, 'cat-fo24', 'FO-A2-01');
  const ppA2a = put(rkA2, 40, 'cat-pp24', 'PP-A2-01');
  put(rkA2, 39, 'cat-mgr1u', 'PC-A2-01');
  const swA2 = put(rkA2, 38, 'cat-c9200l-48p-4x', 'SW-A2-ACC-01');
  put(rkA2, 37, 'cat-mgr1u', 'PC-A2-02');
  const ppA2b = put(rkA2, 36, 'cat-pp24', 'PP-A2-02');
  const upsA2 = put(rkA2, 1, 'cat-5px1500', 'OND-A2-01');
  // Local technique B0 (distribution du bâtiment B)
  const foB0 = put(rkB0, 42, 'cat-fo24', 'FO-B0-01');
  const dist = put(rkB0, 40, 'cat-cx6300m-24', 'SW-B0-DIST-01');
  const ppB0a = put(rkB0, 38, 'cat-pp24', 'PP-B0-01');
  put(rkB0, 37, 'cat-mgr1u', 'PC-B0-01');
  const swB0 = put(rkB0, 36, 'cat-cx6100-48g', 'SW-B0-ACC-01');
  put(rkB0, 35, 'cat-mgr1u', 'PC-B0-02');
  const ppB0b = put(rkB0, 34, 'cat-pp24', 'PP-B0-02');
  const upsB0 = put(rkB0, 1, 'cat-srt3000', 'OND-B0-01');
  // Coffret mural B1 (presque plein : 14U sur 15)
  const foB1 = put(rkB1, 15, 'cat-fo24', 'FO-B1-01');
  const ppB1a = put(rkB1, 14, 'cat-pp24', 'PP-B1-01');
  put(rkB1, 13, 'cat-mgr1u', 'PC-B1-01');
  const swB1a = put(rkB1, 12, 'cat-cx6100-48g', 'SW-B1-ACC-01');
  put(rkB1, 11, 'cat-mgr1u', 'PC-B1-02');
  const ppB1b = put(rkB1, 10, 'cat-pp24', 'PP-B1-02');
  const ppB1c = put(rkB1, 8, 'cat-pp48', 'PP-B1-03');
  put(rkB1, 7, 'cat-mgr1u', 'PC-B1-03');
  const swB1b = put(rkB1, 6, 'cat-usw-pro-24-poe', 'SW-B1-ACC-02');
  const rtrB1 = put(rkB1, 5, 'cat-ccr2004', 'RTR-B1-01', { notes: 'Lien de secours 4G' });
  rtrB1.layer = 'access';   // niveau forcé : ce routeur de secours est raccordé à un switch d'accès
  put(rkB1, 4, 'cat-mgr1u', 'PC-B1-04');
  const upsB1 = put(rkB1, 1, 'cat-5px1500', 'OND-B1-01');

  // --- Liaisons entre équipements actifs ---
  const mark = (p, o) => { Object.assign(p, o); if (o.watts != null) { p.poe.watts = o.watts; delete p.watts; } };
  const trayNext = new Map();
  const tray = t => { const i = trayNext.get(t.id) || 0; trayNext.set(t.id, i + 1); return P(t, i); };
  /* Liaison directe (DAC ou cordon) entre deux ports actifs */
  const direct = (pa, da, pb, dbv, type, len, speed) => {
    cable(pa, pb, type, len);
    mark(pa, { status: 'up', speed, description: `Vers ${dbv.hostname} ${pb.name}` });
    mark(pb, { status: 'up', speed, description: `Vers ${da.hostname} ${pa.name}` });
  };
  /* Liaison fibre passant par deux tiroirs optiques : jarretière, rocade, jarretière */
  const fiber = (pa, da, t1, t2, pb, dbv, type, len, speed) => {
    const x = tray(t1), y = tray(t2);
    cable(pa, x, type, 2); cable(x, y, type, len, null, `Rocade ${t1.hostname} ↔ ${t2.hostname}`); cable(y, pb, type, 2);
    mark(pa, { status: 'up', speed, description: `Uplink vers ${dbv.hostname} ${pb.name}` });
    mark(pb, { status: 'up', speed, description: `Descente vers ${da.hostname} ${pa.name}` });
  };
  direct(PN(fw, 'x1'), fw, P(core, 0), core, 'dac', 2, 10000);
  direct(PN(fw, 'x2'), fw, P(core, 1), core, 'dac', 2, 10000);
  direct(PN(fw, 'wan1'), fw, PN(rtr, 'Gi0/0/1'), rtr, 'patch', 1, 1000);
  mark(PN(rtr, 'Gi0/0/0'), { status: 'up', speed: 1000, connected: 'Opérateur — lien fibre (fictif)', description: 'WAN 203.0.113.2/30' });
  direct(ups(swA0)[0], swA0, P(core, 2), core, 'dac', 2, 10000);
  direct(ups(swA0)[1], swA0, P(core, 3), core, 'dac', 2, 10000);
  direct(ups(swSrv)[0], swSrv, P(core, 4), core, 'dac', 3, 10000);
  direct(ups(swSrv)[1], swSrv, P(core, 5), core, 'dac', 3, 10000);
  fiber(ups(swA1a)[0], swA1a, foA1, foA0, P(core, 6), core, 'om3', 35, 10000);
  fiber(ups(swA1a)[1], swA1a, foA1, foA0, P(core, 7), core, 'om3', 35, 10000);
  fiber(ups(swA1b)[0], swA1b, foA1, foA0, P(core, 8), core, 'om3', 35, 1000);
  fiber(ups(swA1b)[1], swA1b, foA1, foA0, P(core, 9), core, 'om3', 35, 1000);
  fiber(ups(swA2)[0], swA2, foA2, foA0, P(core, 10), core, 'om3', 45, 10000);
  fiber(ups(swA2)[1], swA2, foA2, foA0, P(core, 11), core, 'om3', 45, 10000);
  fiber(P(dist, 24), dist, foB0, foA0, P(core, 12), core, 'os2', 180, 10000);
  fiber(P(dist, 25), dist, foB0, foA0, P(core, 13), core, 'os2', 180, 10000);
  direct(ups(swB0)[0], swB0, P(dist, 0), dist, 'dac', 1, 10000);
  direct(ups(swB0)[1], swB0, P(dist, 1), dist, 'dac', 1, 10000);
  fiber(ups(swB1a)[0], swB1a, foB1, foB0, P(dist, 2), dist, 'om3', 40, 10000);
  fiber(ups(swB1a)[1], swB1a, foB1, foB0, P(dist, 3), dist, 'om3', 40, 10000);
  fiber(ups(swB1b)[0], swB1b, foB1, foB0, P(dist, 4), dist, 'om3', 40, 10000);
  fiber(ups(swB1b)[1], swB1b, foB1, foB0, P(dist, 5), dist, 'om3', 40, 10000);

  // --- Switchs d'accès : file des ports libres (le dernier port sert à la gestion) ---
  const acc = new Map();
  const accPorts = sw => acc.get(sw.id) || acc.set(sw.id, { list: portsOf.get(sw.id).filter(p => p.role === 'access'), cur: 0, end: 0 }).get(sw.id);
  const takeFront = sw => { const a = accPorts(sw); return a.cur < a.list.length - a.end ? a.list[a.cur++] : null; };
  const takeBack = sw => { const a = accPorts(sw); a.end++; return a.list[a.list.length - a.end]; };
  /* Raccorde le port de gestion d'un équipement directement à un switch de la même baie */
  const mgmt = (dev, portName, sw, vlan = 99) => {
    const pa = PN(dev, portName), pb = takeBack(sw);
    cable(pa, pb, 'patch', 2, vcol(vlan));
    mark(pa, { status: 'up', vlan, speed: Math.min(pa.speed, pb.speed) });
    mark(pb, { status: 'up', vlan, speed: Math.min(pa.speed, pb.speed), description: `${dev.hostname} ${portName}` });
  };
  mgmt(upsA0, 'NMC', swA0); mgmt(upsA0b, 'NMC', swSrv); mgmt(upsA1, 'NMC', swA1a); mgmt(upsA2, 'NMC', swA2); mgmt(upsB0, 'NMC', swB0); mgmt(upsB1, 'NMC', swB1a);
  mgmt(fw, 'mgmt', swSrv); mgmt(rtr, 'Mgmt', swSrv); mgmt(rtrB1, 'ether1', swB1b);
  // Serveurs : cartes réseau en VLAN 100, carte de gestion en VLAN 99
  const srvLink = (srv, name, vlan) => { const pa = PN(srv, name), pb = takeFront(swSrv); cable(pa, pb, 'patch', 2, vcol(vlan)); mark(pa, { status: 'up', vlan }); mark(pb, { status: 'up', vlan, description: `${srv.hostname} ${name}` }); };
  srvLink(srv1, 'NIC1', 100); srvLink(srv1, 'NIC2', 100); srvLink(srv1, 'iLO', 99);
  srvLink(srv2, 'NIC1', 100); srvLink(srv2, 'NIC2', 100); srvLink(srv2, 'iLO', 99);
  srvLink(srv3, 'NIC1', 100); srvLink(srv3, 'iDRAC', 99);
  srvLink(srv4, 'NIC1', 100); srvLink(srv4, 'iDRAC', 99);

  // --- Prises murales, terminaux et brassage ---
  Object.assign(F.A0, { rack: rkCore, pps: [ppA0a, ppA0b], sws: [swA0] });
  Object.assign(F.A1, { rack: rkA1, pps: [ppA1a, ppA1b, ppA1c], sws: [swA1a, swA1b] });
  Object.assign(F.A2, { rack: rkA2, pps: [ppA2a, ppA2b], sws: [swA2] });
  Object.assign(F.B0, { rack: rkB0, pps: [ppB0a, ppB0b], sws: [swB0] });
  Object.assign(F.B1, { rack: rkB1, pps: [ppB1a, ppB1b, ppB1c], sws: [swB1a, swB1b] });
  const AP_MODELS = ['cat-mr46', 'cat-u6-pro', 'cat-ap515'], TEL_MODELS = ['cat-8851', 'cat-t54w'], CAM_MODELS = ['cat-p3265', 'cat-ds2cd2143'];
  /* Points répartis le long des murs d'une pièce, à 25 cm du mur */
  const wallPoints = (room, n) => {
    const per = 2 * (room.w + room.h), pts = [];
    for (let i = 0; i < n; i++) {
      let t = ((i + 0.5) / n * per + room.w * 0.3) % per, x, y;
      if (t < room.w) { x = t; y = 0.25; }
      else if ((t -= room.w) < room.h) { x = room.w - 0.25; y = t; }
      else if ((t -= room.h) < room.w) { x = room.w - t; y = room.h - 0.25; }
      else { t -= room.w; x = 0.25; y = room.h - t; }
      pts.push({ x: +clamp(room.x + x, room.x + 0.25, room.x + room.w - 0.25).toFixed(2), y: +clamp(room.y + y, room.y + 0.25, room.y + room.h - 0.25).toFixed(2) });
    }
    return pts;
  };
  for (const ctx of Object.values(F)) {
    const ppPorts = ctx.pps.flatMap(d => portsOf.get(d.id));
    const count = k => (ctx.n[k] = (ctx.n[k] || 0) + 1);
    ctx.rooms.forEach((room, ri2) => {
      const need = ctx.need[ri2];
      const wallN = (need.d || 0) + (need.v || 0) + (need.p || 0);
      const pts = wallPoints(room, wallN);
      const usages = [...Array(need.d || 0).fill('data'), ...Array(need.v || 0).fill('voice'), ...Array(need.p || 0).fill('printer')];
      // Mélange déterministe pour alterner données et voix le long des murs
      for (let i = usages.length - 1; i > 0; i--) { const j = ri(0, i); [usages[i], usages[j]] = [usages[j], usages[i]]; }
      const cx = room.x + room.w / 2, cy = room.y + room.h / 2;
      const items = usages.map((u, i) => ({ usage: u, ...pts[i] }));
      for (let i = 0; i < (need.ap || 0); i++) items.push({ usage: 'ap', x: +(room.x + room.w * (i + 1) / ((need.ap || 0) + 1)).toFixed(2), y: +cy.toFixed(2) });
      for (let i = 0; i < (need.cam || 0); i++) items.push({ usage: 'camera', x: +(room.x + room.w - 0.6).toFixed(2), y: +(room.y + 0.6).toFixed(2) });
      for (const it of items) {
        const label = `${ctx.key}-${String(++ctx.seq).padStart(3, '0')}`;
        const outlet = { id: nextId(db, 'o'), roomId: room.id, label, x: it.x, y: it.y, usage: it.usage };
        db.outlets.push(outlet);
        const ppPort = ppPorts[ctx.ppi++];
        const len = Math.round(Math.abs(it.x - ctx.rack.x) + Math.abs(it.y - ctx.rack.y) + 6);
        cable(outlet, ppPort, 'cat6a', len, null, label);
        ppPort.description = label;
        // Terminal branché sur la prise
        let term = null;
        if (it.usage === 'voice') {
          const dx = cx - it.x, dy = cy - it.y, d = Math.hypot(dx, dy) || 1;
          const dev = add(TEL_MODELS[count('tel') % 2], { hostname: `TEL-${ctx.key}-${pad2(ctx.n.tel)}`, roomId: room.id, x: +(it.x + dx / d * 0.8).toFixed(2), y: +(it.y + dy / d * 0.8).toFixed(2), ip: ip(20), mac: mac() });
          cable(P(dev, 0), outlet, 'patch', 3, '#8b9bb0');
          const pc = `PC-${need.code}-${pad2(count('pc' + need.code))}`;
          mark(P(dev, 0), { status: 'up', vlan: 20 }); mark(P(dev, 1), { status: 'up', vlan: 10, connected: pc, mac: mac() });
          term = { dev, vlan: 20, watts: cat(dev.catalogId).poeDrawW, speed: 1000, desc: `${label} — téléphone et ${pc}` };
        } else if (it.usage === 'ap') {
          const dev = add(AP_MODELS[count('ap') % 3], { hostname: `AP-${ctx.key}-${pad2(ctx.n.ap)}`, roomId: room.id, x: it.x, y: it.y, ip: ip(30), mac: mac() });
          cable(P(dev, 0), outlet, 'patch', 1, '#8b9bb0'); mark(P(dev, 0), { status: 'up', vlan: 30 });
          term = { dev, vlan: 30, watts: cat(dev.catalogId).poeDrawW + ri(-2, 1), speed: 1000, desc: `${label} — borne Wi-Fi` };
        } else if (it.usage === 'camera') {
          const dev = add(CAM_MODELS[count('cam') % 2], { hostname: `CAM-${ctx.key}-${pad2(ctx.n.cam)}`, roomId: room.id, x: it.x, y: it.y, ip: ip(40), mac: mac() });
          cable(P(dev, 0), outlet, 'patch', 1, '#8b9bb0'); mark(P(dev, 0), { status: 'up', vlan: 40, speed: 100 });
          term = { dev, vlan: 40, watts: cat(dev.catalogId).poeDrawW, speed: 100, desc: `${label} — caméra` };
        } else if (it.usage === 'printer') {
          term = { name: `IMP-${need.code}-${pad2(count('imp' + need.code))}`, vlan: 50, watts: 0, speed: 1000, desc: `${label} — imprimante` };
        } else {
          term = { name: `PC-${need.code}-${pad2(count('pc' + need.code))}`, vlan: 10, watts: 0, speed: R() < 0.12 ? 100 : 1000, desc: label };
        }
        // Brassage : environ 85 % des prises de données, et toutes les autres
        const patched = it.usage !== 'data' || R() < 0.85;
        if (!patched) continue;
        let sw = ctx.sws[ri2 % ctx.sws.length], sp = takeFront(sw);
        if (!sp) { sw = ctx.sws.find(s => s !== sw) || sw; sp = takeFront(sw); }
        if (!sp) continue;
        cable(ppPort, sp, 'patch', ri(1, 2), vcol(term.vlan));
        const r = R();
        const status = term.dev ? (r < 0.96 ? 'up' : 'down') : (r < 0.8 ? 'up' : r < 0.93 ? 'down' : 'disabled');
        mark(sp, { status, vlan: term.vlan, speed: term.speed, watts: status === 'up' ? term.watts : 0, description: term.desc, connected: term.dev ? '' : term.name, mac: term.dev ? term.dev.mac : mac() });
        if (term.dev && status !== 'up') mark(P(term.dev, 0), { status: 'down' });
      }
    });
  }

  // --- Quelques anomalies pour illustrer les alertes ---
  const swPortTo = pred => db.ports.find(p => p.role === 'access' && /^SW-/.test(db.devices.find(d => d.id === p.deviceId).hostname) && pred(p));
  const e1 = swPortTo(p => /^B0-.*caméra/.test(p.description)); if (e1) mark(e1, { status: 'error', watts: 0, description: e1.description + ' (erreurs CRC)' });
  const e2 = swPortTo(p => /^A1-.*borne/.test(p.description)); if (e2) mark(e2, { status: 'error', watts: 0, description: e2.description + ' (défaut PoE)' });
  const e3 = swPortTo(p => /^A2-/.test(p.description) && p.connected.startsWith('PC-') && p.status === 'up'); if (e3) mark(e3, { status: 'error', description: e3.description + ' (boucle détectée)' });
  const apKo = db.devices.find(d => d.hostname === 'AP-B0-03'); if (apKo) apKo.status = 'fault';

  // --- Historique de départ ---
  const now = Date.now(), H = 3600e3;
  const hist = [
    [2, 'add', 'Installation de AP-B1-02 (Salle de formation)'],
    [26, 'edit', 'Port Gi1/0/12 de SW-A1-ACC-01 : VLAN 20 (VOIX)'],
    [50, 'stock', 'Entrée en stock : 10 × Cordon RJ45 Cat6A 1 m'],
    [75, 'move', 'Déplacement de SRV-A0-04 vers BAIE-A0-02, U25'],
    [120, 'remove', 'Retrait d\'un switch USW-Pro-24-PoE (retour en stock)'],
    [200, 'import', 'Initialisation du jeu de données de démonstration'],
  ];
  db.history = hist.map(([h, type, text]) => ({ id: nextId(db, 'h'), ts: now - h * H, type, text, ref: null }));
  db.meta.updatedAt = now;
  return db;
}

/* ============================================================
   === SECTION 6 — STORE (état, index, historique, annulation, sauvegarde)
   Toute modification passe par Store.commit(type, texte, mutation).
   ============================================================ */
const Store = {
  db: null, idx: null, undoStack: [], subs: new Set(), saveTimer: 0, saveError: false,
  MAX_UNDO: 25, MAX_HISTORY: 400,

  init() {
    this.db = this.loadLocal() || buildDemo();
    this.reindex();
  },
  /* Vérifie qu'un objet ressemble à une base NetCarto */
  validate(d) {
    if (!d || typeof d !== 'object' || !d.meta || d.meta.app !== APP.name) return 'Ce fichier n\'est pas un export NetCarto.';
    if (d.meta.schemaVersion > APP.schemaVersion) return 'Ce fichier vient d\'une version plus récente de NetCarto.';
    for (const k of Object.keys(emptyDb())) if (k !== 'meta' && !Array.isArray(d[k])) return `Section « ${k} » absente ou invalide.`;
    return null;
  },
  loadLocal() {
    try {
      const s = localStorage.getItem(APP.storageKey);
      if (!s) return null;
      const d = JSON.parse(s);
      return this.validate(d) ? null : d;
    } catch { return null; }
  },
  /* Sauvegarde locale, avec un court délai pour regrouper les modifications */
  save() {
    clearTimeout(this.saveTimer);
    this.saveTimer = setTimeout(() => {
      try { localStorage.setItem(APP.storageKey, JSON.stringify(this.db)); this.saveError = false; }
      catch (e) { if (!this.saveError) toast('Sauvegarde locale impossible (stockage plein ou bloqué). Pensez à exporter vos données.', 'warn'); this.saveError = true; }
    }, 300);
  },
  /* Reconstruit tous les index de recherche rapide */
  reindex() {
    const d = this.db;
    const I = { id: new Map(), cat: new Map(), stock: new Map(), vlan: new Map(), portsByDev: new Map(), cabByEnd: new Map(), devByRack: new Map(), devByRoom: new Map(), outByRoom: new Map(), racksByRoom: new Map(), roomsByFloor: new Map(), floorsByBld: new Map(), bldBySite: new Map(), devByCat: new Map() };
    const push = (m, k, v) => { if (k == null) return; const a = m.get(k); if (a) a.push(v); else m.set(k, [v]); };
    for (const k of ['sites', 'buildings', 'floors', 'rooms', 'racks', 'devices', 'ports', 'outlets', 'cables']) for (const e of d[k]) I.id.set(e.id, e);

    if (!animate) { this.camera.position.copy(pos); this.controls.target.copy(target); this.controls.update(); this.dirty = true; return; }
    this.anim = { t0: performance.now(), p0: this.camera.position.clone(), q0: this.controls.target.clone(), p1: pos, q1: target };
  }
  stepAnim(t) {

  frameAll(animate = true) {

    const yc = g.yBase + g.H / 2 - 0.05, dist = (g.H / 2) / Math.tan(this.camera.fov * Math.PI / 360) * 1.12;

  focus(id) {

    if (i != null) { const e = this.ports[i]; this.flyTo(new THREE.Vector3(e.x * 0.7 + 0.05, e.y + 0.06, g.zF + 0.5), new THREE.Vector3(e.x, e.y, g.zF)); }

}

function roundedSlab(T, w, d, h, r) {
  const s = new T.Shape(), x = -w / 2, y = -d / 2;
  s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r); s.lineTo(x + w, y + d - r); s.quadraticCurveTo(x + w, y + d, x + w - r, y + d);

  g.rotateX(-Math.PI / 2); g.translate(0, b, 0);

function renderActive(force) {

/* --- Notifications --- */
function toast(msg, kind = 'ok', action = null) {
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.innerHTML = `<span>${esc(msg)}</span>${action ? `<button class="btn sm">${esc(action.label)}</button>` : ''}`;
  if (action) el.querySelector('button').onclick = () => { action.fn(); el.remove(); };
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), action ? 7000 : 4200);
}
/* Exécute une action et affiche l'erreur éventuelle au lieu de planter */
function run(fn) {
  try { return fn(); }
  catch (e) { console.warn(e); toast(e.message || 'Erreur inattendue', 'err'); return undefined; }
}
const undoAction = { label: 'Annuler', fn: () => Actions.undo() };

/* --- Infobulles : attribut data-tip="Titre|ligne|ligne" ou appel direct Tip.show(html, x, y) --- */
const Tip = {
  el: null,
  show(html, x, y) {
    const el = this.el || (this.el = $('#tip'));
    el.innerHTML = html; el.style.display = 'block';
    const w = el.offsetWidth, h = el.offsetHeight;
    el.style.left = clamp(x + 14, 6, innerWidth - w - 6) + 'px';
    el.style.top = (y + 18 + h > innerHeight ? y - h - 10 : y + 18) + 'px';
  },
  hide() { if (this.el) this.el.style.display = 'none'; },
  /* Convertit le texte « Titre|ligne|ligne » en HTML */
  fmt(s) { const [t, ...l] = String(s).split('|'); return `<b>${esc(t)}</b>${l.map(x => `<div class="l">${esc(x)}</div>`).join('')}`; },
};
document.addEventListener('mousemove', e => {
  const el = e.target.closest?.('[data-tip]');
  if (el) Tip.show(Tip.fmt(el.dataset.tip), e.clientX, e.clientY);
  else if (!e.target.closest?.('[data-tipkeep]')) Tip.hide();
});
document.addEventListener('mouseleave', () => Tip.hide());

/* --- Modales --- */
const Modal = {
  onOk: null,
  /* open({ title, body, ok, okClass, cancel, wide, onOk(données du formulaire), onOpen(élément) }) */
  open(o) {
    const root = $('#modal-root');
    root.innerHTML = `<div class="modal ${o.wide ? 'wide' : ''}" role="dialog" aria-modal="true">
      <header><h2>${o.title}</h2><button class="btn icon sm" data-act="modal-close" aria-label="Fermer">${ico('x')}</button></header>
      <div class="body">${o.body}</div>
      <footer>${o.footer || ''}<button class="btn" data-act="modal-close">${o.cancel || 'Annuler'}</button>${o.ok === false ? '' : `<button class="btn ${o.okClass || 'pri'}" data-act="modal-ok">${o.ok || 'Valider'}</button>`}</footer></div>`;
    root.classList.add('on');
    this.onOk = o.onOk || null;
    o.onOpen?.(root.firstElementChild);
    (root.querySelector('[autofocus]') || root.querySelector('.body input, .body select'))?.focus();
  },
  close() { const r = $('#modal-root'); r.classList.remove('on'); r.innerHTML = ''; this.onOk = null; },
  /* Lit tous les champs nommés de la modale */
  data() {
    const o = {};
    for (const el of $$('#modal-root [name]')) o[el.name] = el.type === 'checkbox' ? el.checked : el.type === 'number' ? (el.value === '' ? null : +el.value) : el.value.trim();
    return o;
  },
  confirm(title, text, onOk, ok = 'Confirmer', okClass = 'pri') { this.open({ title, body: `<p style="margin:0">${text}</p>`, ok, okClass, onOk }); },
};
Actions['modal-close'] = () => Modal.close();
Actions['modal-ok'] = () => {
  if (!Modal.onOk) return Modal.close();
  const res = run(() => Modal.onOk(Modal.data()));
  if (res !== false && res !== undefined) Modal.close();
};
$('#modal-root').addEventListener('mousedown', e => { if (e.target.id === 'modal-root') Modal.close(); });

/* --- Gestionnaires délégués --- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (el && !el.disabled) { const fn = Actions[el.dataset.act]; if (fn) run(() => fn(el, e)); }
  if (!e.target.closest('.gsearch')) $('#gsearch-res').classList.add('hidden');
});
document.addEventListener('change', e => { const el = e.target.closest('[data-chg]'); if (el) { const fn = Changes[el.dataset.chg]; if (fn) run(() => fn(el, e)); } });
document.addEventListener('input', e => { const el = e.target.closest('[data-inp]'); if (el) { const fn = Inputs[el.dataset.inp]; if (fn) run(() => fn(el, e)); } });
document.addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  if (e.key === 'Escape') { if ($('#modal-root').classList.contains('on')) Modal.close(); else { $('#gsearch-res').classList.add('hidden'); if (typing) e.target.blur(); } }
  else if (e.key === '/' && !typing) { e.preventDefault(); $('#gsearch').focus(); $('#gsearch').select(); }
  else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !typing) { e.preventDefault(); Actions.undo(); }
  else if (e.key === 'Enter' && $('#modal-root').classList.contains('on') && e.target.tagName !== 'TEXTAREA' && e.target.tagName !== 'BUTTON') { e.preventDefault(); Actions['modal-ok'](); }
});

  Carto.sel = id;
  if (l.floor) Carto.floorId = l.floor.id;
  if (l.rack) Carto.rackId = l.rack.id;
  for (const k of ['site', 'building', 'floor', 'room', 'rack']) if (l[k] && l[k].id !== id) Carto.open.add(l[k].id);
  if (o.view) Carto.view = o.view;
  else if (!o.keep) Carto.view = l.rack ? 'rack' : 'plan';
  if (!o.keep) View3D.focusReq = true;
  if (UI.tab !== 'carto') showTab('carto'); else renderCarto();

/* --- Modification d'un port ou d'une prise depuis la fiche --- */
const PORT_FIELD = { status: 'état', vlan: 'VLAN', speed: 'débit', watts: 'PoE', mac: 'MAC', connected: 'appareil connecté', description: 'description' };
Changes['port-f'] = el => {
  const p = byId(el.dataset.id), f = el.dataset.f;
  let v = el.value.trim(), shown = v;
  if (f === 'vlan') { v = v === '' ? null : +v; shown = v == null ? 'Trunk' : `${v} (${vlanOf(v).name})`; }
  if (f === 'speed') { v = +v; shown = fmtSpeed(v); }
  if (f === 'status') shown = PORT_STATUS[v].label;
  if (f === 'watts') { v = clamp(+v || 0, 0, 90); shown = `${v} W`; }
  if (f === 'mac' && v && !/^([0-9a-f]{2}[:-]){5}[0-9a-f]{2}$/i.test(v)) { renderDetail(); throw new Error('Adresse MAC invalide (format attendu : 02:00:00:00:00:00).'); }
  Store.commit('edit', `Port ${labelOf(p.id)} : ${PORT_FIELD[f]} → ${shown || '(vide)'}`, () => {
    if (f === 'watts') p.poe.watts = v; else p[f] = v;
    if (f === 'status' && v !== 'up') p.poe.watts = 0;
  }, p.id);
};
Changes['outlet-f'] = el => {
  const o = byId(el.dataset.id), f = el.dataset.f, v = el.value.trim();
  if (f === 'label') {
    if (!v) { renderDetail(); throw new Error('Le repère de la prise ne peut pas être vide.'); }
    if (Store.db.outlets.some(x => x.id !== o.id && x.label === v)) { renderDetail(); throw new Error(`Le repère ${v} est déjà utilisé.`); }
  }
  Store.commit('edit', `Prise ${o.label} : ${f === 'label' ? 'repère' : 'usage'} → ${f === 'label' ? v : OUTLET_USAGE[v]}`, () => { o[f] = v; }, o.id);
};

/* Zoom à la molette et déplacement à la souris pour un SVG (cadrage fourni par getVb) */
function panZoom(host, sel, getVb) {
  const apply = svg => { const vb = getVb(); svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`); };
  host.addEventListener('wheel', e => {
    const svg = $(sel, host); if (!svg) return; e.preventDefault();
    const vb = getVb(), pt = svgPoint(svg, e), k = e.deltaY > 0 ? 1.18 : 1 / 1.18;
    vb.x = pt.x - (pt.x - vb.x) * k; vb.y = pt.y - (pt.y - vb.y) * k; vb.w *= k; vb.h *= k; apply(svg);
  }, { passive: false });
  host.addEventListener('pointerdown', e => {
    const svg = $(sel, host); if (!svg || e.button !== 0 || !e.target.closest(sel)) return;
    const vb = getVb(), sx = e.clientX, sy = e.clientY, inv = svg.getScreenCTM().inverse().a, x0 = vb.x, y0 = vb.y;
    planDrag.moved = false;
    const move = ev => { if (!planDrag.moved && Math.hypot(ev.clientX - sx, ev.clientY - sy) < 4) return; planDrag.moved = true; Tip.hide(); vb.x = x0 - (ev.clientX - sx) * inv; vb.y = y0 - (ev.clientY - sy) * inv; apply(svg); };
    const up = () => { removeEventListener('pointermove', move); removeEventListener('pointerup', up); };
    addEventListener('pointermove', move); addEventListener('pointerup', up);
  });
  host.addEventListener('click', e => { if (planDrag.moved) { e.stopPropagation(); e.preventDefault(); planDrag.moved = false; } }, true);
}
